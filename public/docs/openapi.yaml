openapi: 3.0.3
info:
  title: 'ApiZas API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Autenticación
    description: ''
  -
    name: 'Juegos de mesa'
    description: ''
  -
    name: Partidas
    description: ''
  -
    name: Sesiones
    description: ''
  -
    name: Tipos
    description: ''
  -
    name: Usuarios
    description: ''
components:
  securitySchemes:
    default:
      type: apiKey
      name: authorization
      in: header
      description: 'Obtén tu token llamando al endpoint /api/v1/login.'
security:
  -
    default: []
paths:
  /api/v1/login:
    post:
      summary: 'Iniciar sesión en la aplicación.'
      operationId: iniciarSesinEnLaAplicacin
      description: 'Logea al usuario en la aplicación.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9!
                  user:
                    id: 1
                    num_partner: 123
                    nickname: john_doe
                    name: 'John Doe'
                    email: john.doe@example.com
                properties:
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9!
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      num_partner:
                        type: integer
                        example: 123
                      nickname:
                        type: string
                        example: john_doe
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: john.doe@example.com
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User not autenticated'
                properties:
                  message:
                    type: string
                    example: 'User not autenticated'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not Found'
                properties:
                  message:
                    type: string
                    example: 'Not Found'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'The email field is required.'
                    password:
                      - 'The password field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field is required.'
                        items:
                          type: string
      tags:
        - Autenticación
      security: []
  /api/v1/register:
    post:
      summary: 'Registrar un nuevo usuario.'
      operationId: registrarUnNuevoUsuario
      description: 'Crea un nuevo usuario en la aplicación.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: fake-token
                  user:
                    id: 1
                    num_partner: 123
                    nickname: john_doe
                    name: 'John Doe'
                    email: john.doe@example.com
                properties:
                  token:
                    type: string
                    example: fake-token
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      num_partner:
                        type: integer
                        example: 123
                      nickname:
                        type: string
                        example: john_doe
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: john.doe@example.com
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: eyJ0eXAiOiJKV1QiLC
                  user:
                    id: 1
                    num_partner: 123
                    nickname: john_doe
                    name: 'John Doe'
                    email: john.doe@example.com
                properties:
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLC
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      num_partner:
                        type: integer
                        example: 123
                      nickname:
                        type: string
                        example: john_doe
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: john.doe@example.com
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    email:
                      - 'The email field is required.'
                    password:
                      - 'The password field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field is required.'
                        items:
                          type: string
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User Not autenticated'
                properties:
                  message:
                    type: string
                    example: 'User Not autenticated'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                num_partner:
                  type: integer
                  description: ''
                  example: 17
                nickname:
                  type: string
                  description: ''
                  example: consequatur
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: eloisa.harber@example.com
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: '[*UyPJ"}6'
                type:
                  type: string
                  description: ''
                  example: guest
                  enum:
                    - admin
                    - junta
                    - partner
                    - guest
                registration_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-04-07T09:30:12'
                telephone:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: true
                age:
                  type: integer
                  description: ''
                  example: 17
                language:
                  type: string
                  description: ''
                  example: es
                  enum:
                    - en
                    - es
                    - ca
              required:
                - num_partner
                - nickname
                - name
                - email
                - password
                - type
                - registration_date
                - age
                - language
      security: []
  /api/v1/logout:
    post:
      summary: 'Cerrar sesión en la aplicación.'
      operationId: cerrarSesinEnLaAplicacin
      description: 'Saca al usuario de la aplicación.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User Not autenticated'
                properties:
                  message:
                    type: string
                    example: 'User Not autenticated'
      tags:
        - Autenticación
  /api/v1/boardgames:
    get:
      summary: 'Listar juegos de mesa'
      operationId: listarJuegosDeMesa
      description: 'Devuelve todos los juegos de mesa disponibles.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: 'Juego A'
                    slug:
                      type: string
                      example: juego-a
                    min_players:
                      type: integer
                      example: 2
                    max_players:
                      type: integer
                      example: 10
                    min_age:
                      type: integer
                      example: 8
                    duration:
                      type: integer
                      example: 60
                    description:
                      type: string
                      example: 'Descripción del juego A'
                example:
                  -
                    id: 1
                    name: 'Juego A'
                    slug: juego-a
                    min_players: 2
                    max_players: 10
                    min_age: 8
                    duration: 60
                    description: 'Descripción del juego A'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
      tags:
        - 'Juegos de mesa'
    post:
      summary: 'Crear juego de mesa'
      operationId: crearJuegoDeMesa
      description: 'Crea un nuevo juego de mesa con los datos proporcionados.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Juego A'
                  slug: juego-a
                  min_players: 2
                  max_players: 10
                  min_age: 8
                  duration: 60
                  description: 'Descripción del juego A'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Juego A'
                  slug:
                    type: string
                    example: juego-a
                  min_players:
                    type: integer
                    example: 2
                  max_players:
                    type: integer
                    example: 10
                  min_age:
                    type: integer
                    example: 8
                  duration:
                    type: integer
                    example: 60
                  description:
                    type: string
                    example: 'Descripción del juego A'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
      tags:
        - 'Juegos de mesa'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: consequatur
                slug:
                  type: string
                  description: ''
                  example: consequatur
                min_players:
                  type: integer
                  description: ''
                  example: 17
                max_players:
                  type: integer
                  description: ''
                  example: 17
                min_age:
                  type: integer
                  description: ''
                  example: 17
                duration:
                  type: integer
                  description: ''
                  example: 17
                description:
                  type: string
                  description: ''
                  example: 'Dolores dolorum amet iste laborum eius est dolor.'
                owner_user_id:
                  type: integer
                  description: ''
                  example: 17
              required:
                - name
                - slug
                - min_players
                - max_players
                - min_age
                - duration
                - description
  '/api/v1/boardgames/{id}':
    get:
      summary: 'Obtener detalle de un juego de mesa'
      operationId: obtenerDetalleDeUnJuegoDeMesa
      description: 'Devuelve la información completa de un juego de mesa específico.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Juego A'
                  slug: juego-a
                  min_players: 2
                  max_players: 10
                  min_age: 8
                  duration: 60
                  description: 'Descripción del juego A'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Juego A'
                  slug:
                    type: string
                    example: juego-a
                  min_players:
                    type: integer
                    example: 2
                  max_players:
                    type: integer
                    example: 10
                  min_age:
                    type: integer
                    example: 8
                  duration:
                    type: integer
                    example: 60
                  description:
                    type: string
                    example: 'Descripción del juego A'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not Found'
                properties:
                  message:
                    type: string
                    example: 'Not Found'
      tags:
        - 'Juegos de mesa'
    put:
      summary: 'Actualizar juego de mesa'
      operationId: actualizarJuegoDeMesa
      description: 'Actualiza la información de un juego de mesa específico.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Juego A'
                  slug: juego-a
                  min_players: 2
                  max_players: 10
                  min_age: 8
                  duration: 60
                  description: 'Descripción del juego A'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Juego A'
                  slug:
                    type: string
                    example: juego-a
                  min_players:
                    type: integer
                    example: 2
                  max_players:
                    type: integer
                    example: 10
                  min_age:
                    type: integer
                    example: 8
                  duration:
                    type: integer
                    example: 60
                  description:
                    type: string
                    example: 'Descripción del juego A'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not Found'
                properties:
                  message:
                    type: string
                    example: 'Not Found'
      tags:
        - 'Juegos de mesa'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: consequatur
                slug:
                  type: string
                  description: ''
                  example: consequatur
                min_players:
                  type: integer
                  description: ''
                  example: 17
                max_players:
                  type: integer
                  description: ''
                  example: 17
                min_age:
                  type: integer
                  description: ''
                  example: 17
                duration:
                  type: integer
                  description: ''
                  example: 17
                description:
                  type: string
                  description: ''
                  example: 'Dolores dolorum amet iste laborum eius est dolor.'
                owner_user_id:
                  type: integer
                  description: ''
                  example: 17
    delete:
      summary: 'Eliminar juego de mesa'
      operationId: eliminarJuegoDeMesa
      description: 'Elimina un juego de mesa del sistema.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Boardgame deleted'
                properties:
                  message:
                    type: string
                    example: 'Boardgame deleted'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not Found'
                properties:
                  message:
                    type: string
                    example: 'Not Found'
      tags:
        - 'Juegos de mesa'
    parameters:
      -
        in: path
        name: id
        description: 'El ID del juego de mesa. Ejemplo: 1'
        example: 17
        required: true
        schema:
          type: integer
  '/api/v1/zassessions/{id}/games':
    get:
      summary: 'Listar partidas de una sesión'
      operationId: listarPartidasDeUnaSesin
      description: 'Devuelve todas las partidas disponibles de una sesión específica.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    zassession_id:
                      type: integer
                      example: 1
                    boardgame_id:
                      type: integer
                      example: 1
                    host_user_id:
                      type: integer
                      example: 1
                    max_players:
                      type: integer
                      example: 10
                    start_time:
                      type: string
                      example: '14:30:00'
                    status:
                      type: string
                      example: open
                    necesary_know_how:
                      type: boolean
                      example: true
                example:
                  -
                    id: 1
                    zassession_id: 1
                    boardgame_id: 1
                    host_user_id: 1
                    max_players: 10
                    start_time: '14:30:00'
                    status: open
                    necesary_know_how: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
      tags:
        - Partidas
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the zassession.'
        example: '1562'
        required: true
        schema:
          type: string
      -
        in: path
        name: session_id
        description: 'El ID de la sesión. Ejemplo: 1'
        example: 17
        required: true
        schema:
          type: integer
  /api/v1/games:
    get:
      summary: 'Listar todas las partidas'
      operationId: listarTodasLasPartidas
      description: 'Devuelve todas las partidas disponibles.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    zassession_id:
                      type: integer
                      example: 1
                    boardgame_id:
                      type: integer
                      example: 1
                    host_user_id:
                      type: integer
                      example: 1
                    max_players:
                      type: integer
                      example: 10
                    start_time:
                      type: string
                      example: '14:30:00'
                    status:
                      type: string
                      example: 'en curso'
                    necesary_know_how:
                      type: boolean
                      example: true
                example:
                  -
                    id: 1
                    zassession_id: 1
                    boardgame_id: 1
                    host_user_id: 1
                    max_players: 10
                    start_time: '14:30:00'
                    status: 'en curso'
                    necesary_know_how: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
      tags:
        - Partidas
    post:
      summary: 'Crear partida'
      operationId: crearPartida
      description: 'Crea una nueva partida con los datos proporcionados.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  zassession_id: 1
                  boardgame_id: 1
                  host_user_id: 1
                  max_players: 10
                  start_time: '14:30:00'
                  status: 'en curso'
                  necesary_know_how: true
                properties:
                  id:
                    type: integer
                    example: 1
                  zassession_id:
                    type: integer
                    example: 1
                  boardgame_id:
                    type: integer
                    example: 1
                  host_user_id:
                    type: integer
                    example: 1
                  max_players:
                    type: integer
                    example: 10
                  start_time:
                    type: string
                    example: '14:30:00'
                  status:
                    type: string
                    example: 'en curso'
                  necesary_know_how:
                    type: boolean
                    example: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Forbidden
                properties:
                  message:
                    type: string
                    example: Forbidden
      tags:
        - Partidas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zassession_id:
                  type: integer
                  description: ''
                  example: 17
                boardgame_id:
                  type: integer
                  description: ''
                  example: 17
                host_user_id:
                  type: integer
                  description: ''
                  example: 17
                max_players:
                  type: integer
                  description: ''
                  example: 17
                start_time:
                  type: string
                  description: 'Must be a valid date in the format <code>H:i:s</code>.'
                  example: '09:30:12'
                status:
                  type: string
                  description: ''
                  example: consequatur
                necesary_know_how:
                  type: boolean
                  description: ''
                  example: false
              required:
                - zassession_id
                - boardgame_id
